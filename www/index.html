<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet" />
    <link rel="icon" href="data:," />
    <title>掃除アプリ（個人用HTML版）</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fbfaf6;
        --card: #ffffff;
        --ink: #2e2a26;
        --sub: #7a7268;
        --line: #e7e1d3;
        --accent: #4d7c5f;
        --accent-deep: #3c6449;
        --accent-soft: #eef4ea;
        --soft: #dce8d8;
        --accent2: #e8a04c;
        --accent-ink: #ffffff;
        --danger: #b5502f;
        --danger-soft: #f7e9e2;
        --tab-bg: #ffffff;
        --shadow: 0 1px 2px rgba(46, 42, 38, 0.05);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1b1e19;
          --card: #262a23;
          --ink: #f0eee6;
          --sub: #a49d90;
          --line: #3b4036;
          --accent: #84b894;
          --accent-deep: #a5cdb0;
          --accent-soft: #2b332a;
          --soft: #3c4c38;
          --accent2: #eeb26a;
          --accent-ink: #ffffff;
          --danger: #e08a6d;
          --danger-soft: #3a2a24;
          --tab-bg: #262a23;
          --shadow: none;
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
        line-height: 1.5;
      }
      button, select, input { font: inherit; color: inherit; }
      button { cursor: pointer; }
      button:focus-visible, select:focus-visible, input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .wrap {
        max-width: 576px;
        margin: 0 auto;
        padding: 20px 16px 104px;
      }
      .font-display, .today-title, .sec-title, .card h2, .cal-head .ym, .tabbtn, .done-btn {
        font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
      }
      /* ---------- 今日 ---------- */
      .today-head { padding: 4px 0 16px; }
      .today-title { font-size: 30px; font-weight: 900; margin: 0; line-height: 1.25; }
      .today-title .today-wd { font-size: 20px; font-weight: 700; color: var(--accent); margin-left: 8px; }
      .today-count { color: var(--sub); font-size: 14px; margin: 4px 0 0; }
      .progress {
        height: 10px;
        border-radius: 999px;
        background: var(--soft);
        overflow: hidden;
        margin: 0 0 16px;
      }
      .progress > i {
        display: block;
        height: 100%;
        border-radius: 999px;
        background: var(--accent);
        transition: width 0.5s ease;
      }
      .sec-title {
        font-size: 16px; font-weight: 700; color: var(--ink);
        margin: 26px 0 10px;
      }
      .sec-title:first-of-type { margin-top: 0; }
      .sec-desc { color: var(--sub); font-size: 12px; margin: -2px 0 12px; }
      .notice {
        background: var(--accent-soft);
        color: var(--accent-deep);
        border-radius: 12px;
        padding: 10px 12px;
        font-size: 14px;
        margin: 0 0 12px;
      }
      .extra-cta {
        width: 100%;
        min-height: 56px;
        border: 2px dashed var(--accent);
        background: var(--accent-soft);
        color: var(--accent-deep);
        border-radius: 16px;
        padding: 16px;
        font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif;
        font-size: 16px;
        font-weight: 700;
      }
      .extra-dot {
        width: 10px; height: 10px;
        border-radius: 50%;
        background: var(--accent2);
        flex-shrink: 0;
      }
      .yatta-label {
        font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif;
        font-size: 14px; font-weight: 700; color: var(--accent);
        flex-shrink: 0;
      }
      .picker-cancel {
        width: 100%;
        min-height: 48px;
        border: 1px solid var(--line);
        background: var(--card);
        border-radius: 12px;
        font-size: 16px;
        color: var(--sub);
      }
      .check-circle {
        width: 44px; height: 44px;
        border-radius: 50%;
        border: 2.5px solid var(--line);
        background: var(--card);
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
      }
      .check-circle.filled { border-color: var(--accent); background: var(--accent); }
      .check-circle svg { width: 22px; height: 22px; }
      @keyframes check-pop {
        0% { transform: scale(0.55); }
        60% { transform: scale(1.18); }
        100% { transform: scale(1); }
      }
      .check-pop { animation: check-pop 0.28s ease-out; }
      .task {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: var(--shadow);
        padding: 12px 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 10px;
        width: 100%;
        text-align: left;
      }
      .task:active { transform: scale(0.99); }
      /* ---------- 今日：できたものを別段落に落とす ---------- */
      .done-sep {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 32px 2px 14px;
      }
      .done-sep::before, .done-sep::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--line);
      }
      .done-sep-label {
        font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: var(--accent);
        white-space: nowrap;
      }
      .done-group {
        margin-left: 12px;
      }
      .done-group .task { width: 100%; }
      .task.is-done {
        background: var(--accent-soft);
        border-color: transparent;
        box-shadow: none;
      }
      .task-main { flex: 1; min-width: 0; }
      .task-name { display: block; font-size: 16px; font-weight: 500; line-height: 1.4; }
      .task-name.done-name { color: var(--sub); text-decoration: line-through; }
      .task-sub { display: block; color: var(--sub); font-size: 12px; margin-top: 2px; }
      .chip {
        display: inline-block;
        background: var(--accent-soft);
        color: var(--accent-deep);
        font-size: 12px; font-weight: 700;
        padding: 2px 9px;
        border-radius: 999px;
        vertical-align: 3px;
        margin-left: 6px;
        white-space: nowrap;
      }
      .chip.pause { background: var(--danger-soft); color: var(--danger); }
      .done-btn {
        background: var(--accent);
        color: var(--accent-ink);
        border: none;
        border-radius: 999px;
        min-height: 44px;
        padding: 0 20px;
        font-size: 15px;
        font-weight: 700;
        flex-shrink: 0;
      }
      .done-btn:active { transform: scale(0.97); }
      .done-label {
        font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif;
        font-size: 14px; font-weight: 700; color: var(--accent);
        flex-shrink: 0;
      }
      .empty {
        background: var(--card);
        border: 1px dashed var(--line);
        border-radius: 16px;
        padding: 26px 16px;
        text-align: center;
        color: var(--sub);
        font-size: 16px;
      }
      .rowline {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: var(--shadow);
        padding: 12px 12px 12px 16px;
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }
      .rowline .rname { flex: 1; min-width: 0; font-size: 16px; }
      .rowline .rname.done-name { color: var(--sub); text-decoration: line-through; }
      /* ---------- ボタン ---------- */
      .btn {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 999px;
        min-height: 36px;
        padding: 0 14px;
        font-size: 14px;
        font-weight: 500;
        flex-shrink: 0;
      }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
      .btn.danger { color: var(--danger); }
      .btn.big { min-height: 48px; font-size: 16px; width: 100%; border-radius: 12px; font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif; font-weight: 700; }
      /* ---------- 項目 ---------- */
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: var(--shadow);
        padding: 16px;
        margin-bottom: 12px;
      }
      .card h2 { font-size: 17px; margin: 0 0 12px; }
      .item-head { display: flex; align-items: flex-start; gap: 10px; }
      .item-main { flex: 1; min-width: 0; }
      .item-name { font-size: 17px; font-weight: 700; line-height: 1.35; }
      .item-sub { color: var(--sub); font-size: 13px; margin-top: 2px; }
      .item-btns { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
      .item-card { padding: 12px 12px 12px 16px; }
      .item-card .item-head { align-items: center; }
      .expand-btn {
        width: 40px; height: 40px; min-height: 40px;
        border-radius: 50%;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--sub);
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
        padding: 0;
      }
      .expand-btn .plus {
        display: block;
        font-size: 24px; line-height: 1; font-weight: 500;
        transform: translateY(-1px);
        transition: transform 0.18s ease;
      }
      .expand-btn[aria-expanded="true"] .plus { transform: translateY(-1px) rotate(45deg); }
      .expand-btn[aria-expanded="true"] { color: var(--accent-deep); border-color: var(--accent); background: var(--accent-soft); }
      @media (prefers-reduced-motion: reduce) {
        .expand-btn .plus { transition: none; }
      }
      .confirm-box {
        margin-top: 12px;
        background: var(--danger-soft);
        border-radius: 10px;
        padding: 12px;
        font-size: 14px;
      }
      .confirm-box .item-btns { margin-top: 8px; }
      .edit-box { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 14px; }
      /* ---------- フォーム ---------- */
      .fld { display: block; margin-bottom: 12px; }
      .fld > span { display: block; font-size: 13px; font-weight: 700; color: var(--sub); margin-bottom: 5px; }
      .fld input[type="text"], .fld input[type="number"], .fld select {
        width: 100%;
        min-height: 46px;
        padding: 8px 12px;
        font-size: 16px;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 12px;
      }
      .fld.inline { display: flex; align-items: center; gap: 8px; }
      .fld.inline input { width: 110px; }
      .fld.inline > span { margin: 0; color: var(--ink); font-size: 15px; }
      .row2 { display: flex; gap: 12px; }
      .row2 .fld { flex: 1; }
      .hint { color: var(--sub); font-size: 14px; margin: 4px 0 10px; }
      .err { color: var(--danger); font-size: 14px; margin: 6px 0 0; min-height: 1em; }
      .wdrow { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
      .wd {
        width: 40px; height: 40px;
        padding: 0;
        border-radius: 50%;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--sub);
        font-size: 14px; font-weight: 500;
      }
      .wd.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
      /* ---------- カレンダー ---------- */
      .chiprow {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        white-space: nowrap;
        padding: 2px 2px 10px;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      .chiprow::-webkit-scrollbar { display: none; }
      .chipbtn {
        min-height: 32px;
        padding: 0 12px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--sub);
        font-size: 13px; font-weight: 500;
        flex-shrink: 0;
      }
      .chipbtn.on { background: var(--accent2); border-color: var(--accent2); color: #ffffff; font-weight: 700; }
      .cal-head { display: flex; align-items: center; justify-content: space-between; margin: 8px 0 10px; }
      .cal-head .ym { font-size: 20px; font-weight: 900; }
      .cal-head .ym .done-count { font-family: "Hiragino Kaku Gothic ProN", system-ui, sans-serif; font-size: 12px; font-weight: 400; color: var(--sub); margin-left: 8px; white-space: nowrap; }
      .cal-nav { width: 40px; height: 40px; min-height: 40px; border: 1px solid var(--line); background: var(--card); border-radius: 50%; font-size: 18px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
      .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
      .cal-wd { text-align: center; font-size: 12px; font-weight: 500; color: var(--sub); padding: 4px 0; }
      .cell {
        min-height: 50px;
        border: 1px solid transparent;
        background: var(--card);
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        gap: 0;
        padding: 6px 2px 4px;
        font-size: 14px;
      }
      .cell .dnum { font-weight: 500; line-height: 1; color: var(--ink); }
      .cell.today { border-color: var(--accent2); }
      .cell.today .dnum { color: var(--accent2); font-weight: 900; }
      .cell.sel { border-color: var(--accent); background: var(--accent-soft); }
      .cell.focus-day { box-shadow: inset 0 0 0 2px var(--accent2); }
      .cell.blank { visibility: hidden; }
      .dots {
        margin-top: 6px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 3px;
        max-width: 100%;
        padding: 0 2px;
        min-height: 9px;
      }
      .dot {
        width: 7px; height: 7px;
        border-radius: 50%;
        border: 1.5px solid var(--sub);
        background: transparent;
        flex-shrink: 0;
      }
      .dot.done { background: var(--accent); border-color: var(--accent); }
      .dot.focus { width: 9px; height: 9px; background: var(--accent2); border-color: var(--accent2); }
      .dot.warm { border-color: var(--warm); background: var(--warm); }
      /* ---------- そろそろ（間隔を過ぎた項目の暖色） ---------- */
      .task.warm, .day-row.warm, .card.warm { box-shadow: inset 4px 0 0 var(--warm), var(--shadow); }
      .task.warm .check-circle, .day-row.warm .check-circle {
        border-color: var(--warm);
        background: color-mix(in srgb, var(--warm) 16%, var(--card));
      }
      .warm-text { color: var(--warm-t, var(--warm)); font-weight: 700; }
      @media (prefers-color-scheme: dark) {
        .warm-text { color: var(--warm); }
      }
      .dot-more { font-size: 9px; line-height: 1; color: var(--sub); }
      .cal-stats {
        margin: 12px 0 0;
        font-size: 14px;
        color: var(--ink);
      }
      .cal-stats b { font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif; font-size: 16px; color: var(--accent-deep); }
      .day-list { margin-top: 20px; }
      .day-list h2 {
        font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif;
        font-size: 16px; font-weight: 700; margin: 0 0 8px;
      }
      .day-row {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: var(--shadow);
        padding: 10px 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 10px;
      }
      .day-row .check-circle, .rowline .check-circle { width: 36px; height: 36px; border-width: 2px; }
      .day-row .check-circle svg, .rowline .check-circle svg { width: 18px; height: 18px; }
      .day-row .rname { flex: 1; min-width: 0; font-size: 16px; }
      .day-row .rname.is-done { color: var(--sub); text-decoration: line-through; }
      /* ---------- タブバー ---------- */
      #tabbar {
        position: fixed;
        left: 0; right: 0; bottom: 0;
        background: var(--tab-bg);
        border-top: 1px solid var(--line);
        display: flex;
        padding-bottom: env(safe-area-inset-bottom);
        z-index: 10;
      }
      .tabbtn {
        flex: 1;
        min-height: 52px;
        background: none;
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--sub);
        font-size: 16px;
        font-weight: 700;
        padding: 14px 0;
      }
      .tabbtn.on { color: var(--accent); }
      @media (prefers-reduced-motion: reduce) {
        .done-btn:active, .task:active { transform: none; }
        .check-pop { animation: none; }
        .progress > i { transition: none; }
      }
    </style>
  </head>
  <body>
    <main id="view" class="wrap"></main>
    <nav id="tabbar" aria-label="メニュー">
      <button class="tabbtn" data-tab="today"><span>今日</span></button>
      <button class="tabbtn" data-tab="cal"><span>カレンダー</span></button>
      <button class="tabbtn" data-tab="items"><span>項目</span></button>
    </nav>
    <noscript><p style="padding:16px">このアプリはJavaScriptが必要です。</p></noscript>
    <script>
(function () {
  'use strict';
  var LS = 'souji-app-v1';
  var WD = ['日', '月', '火', '水', '木', '金', '土'];
  var WD_ORDER = [1, 2, 3, 4, 5, 6, 0]; // 月〜日

  /* ---------- 日付ユーティリティ ---------- */
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function dstr(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseD(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function todayStr() { return dstr(new Date()); }
  function addD(s, n) { var d = parseD(s); d.setDate(d.getDate() + n); return dstr(d); }
  function diffD(a, b) { return Math.round((parseD(a) - parseD(b)) / 86400000); }
  function fmtMD(s) { var d = parseD(s); return (d.getMonth() + 1) + '/' + d.getDate() + '（' + WD[d.getDay()] + '）'; }
  function fmtLong(s) { var d = parseD(s); return (d.getMonth() + 1) + '月' + d.getDate() + '日（' + WD[d.getDay()] + '）'; }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ---------- 初期データ ---------- */
  function seed() {
    var t = todayStr();
    function it(name, type, interval) {
      return {
        id: uid() + Math.floor(Math.random() * 1e6), name: name, type: type,
        interval: interval || null, fixedKind: 'weekly', weekday: 5, monthDay: 15,
        anchor: t, createdAt: t,
        firstBase: type === 'interval' ? t : null,
        virgin: type === 'interval', pendingMissed: false, paused: false
      };
    }
    return {
      v: 1,
      firstFixDone: true,
      items: [
        it('1階の掃除機かけ', 'interval', 2),
        it('2階の掃除機かけ', 'interval', 3),
        it('猫の器を洗う', 'interval', 2),
        it('洗面台の掃除', 'interval', 3),
        it('トイレの掃除', 'interval', 7),
        it('デスクの上のいらないものを捨てる', 'interval', 7),
        it('枕カバーの洗濯', 'interval', 14),
        it('ゴミをまとめる', 'gomi', null)
      ],
      gomiTypes: [
        { id: uid() + 'a', name: '可燃ごみ', rule: { kind: 'weekly', days: [2, 5] } },
        { id: uid() + 'b', name: 'プラごみ', rule: { kind: 'weekly', days: [3] } },
        { id: uid() + 'c', name: '不燃ごみ', rule: { kind: 'nth', week: 4, weekday: 1 } }
      ],
      records: []
    };
  }

  var state;
  function save() { try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {} }
  try {
    var raw = localStorage.getItem(LS);
    if (raw) { state = JSON.parse(raw); } else { state = seed(); save(); }
  } catch (e) { state = seed(); }
  // 一度だけの補正：まだ一度も記録のない初期項目（virgin）だけ、
  // 初回予定を今日起点に読み替える。記録のある項目の周期は変えない。
  if (state && !state.firstFixDone) {
    var fixToday = todayStr();
    var hasRec = {};
    (state.records || []).forEach(function (r) { hasRec[r.itemId] = true; });
    (state.items || []).forEach(function (it) {
      if (it.type === 'interval' && it.virgin && !hasRec[it.id]) it.firstBase = fixToday;
    });
    state.firstFixDone = true;
    save();
  }

  var ui = {
    tab: 'today',
    extraPicker: false, extraNotice: null,
    editingId: null, confirmDelId: null,
    editingGomiId: null, confirmDelGomiId: null,
    expandedItemId: null, expandedGomiId: null,
    calMonth: todayStr().slice(0, 8) + '01',
    calItemId: state.items.length ? state.items[0].id : null,
    calChipScroll: 0,
    selDay: todayStr()
  };
  var SCHED = new Map();

  /* ---------- 予定の計算 ---------- */
  function fixedMatches(it, ds) {
    var d = parseD(ds);
    if (it.fixedKind === 'weekly') return d.getDay() === it.weekday;
    var last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    return d.getDate() === Math.min(it.monthDay, last);
  }
  function collectionMatches(rule, ds) {
    var d = parseD(ds);
    if (rule.kind === 'weekly') return rule.days.indexOf(d.getDay()) >= 0;
    return d.getDay() === rule.weekday && Math.ceil(d.getDate() / 7) === rule.week;
  }
  function coveredBy(itemId, gtId, date) {
    return state.records.some(function (r) {
      return r.itemId === itemId && (r.gomiTypeId || null) === (gtId || null) && r.covers && r.coversDate === date;
    });
  }
  function computeSchedule() {
    var today = todayStr(), horizon = addD(today, 100);
    var map = new Map(), load = {}, itemDays = {};
    function push(date, e, base) {
      e.base = base || date; // 均し前の本来の日（「今日へ移動」表示用。配置は変えない）
      if (!map.has(date)) map.set(date, []);
      map.get(date).push(e);
      load[date] = (load[date] || 0) + 1;
      if (!itemDays[e.itemId]) itemDays[e.itemId] = new Set();
      itemDays[e.itemId].add(date);
    }
    var i, it, d;
    // 今日すでにやった間隔タイプの分は、今日の重さに数えたままにする。
    // （完了した分だけ今日が軽くなると、均し直しのときに別の項目が
    //   今日へ繰り上がってきて、やるほど今日の分が増えてしまうため。
    //   固定・ゴミは完了しても予定に残るので、ここでは数えない）
    state.records.forEach(function (r) {
      if (r.date !== today || !r.covers || r.coversDate !== today) return;
      var rit = state.items.find(function (x) { return x.id === r.itemId; });
      if (rit && rit.type === 'interval') load[today] = (load[today] || 0) + 1;
    });
    // 記録済みの実施日（間隔3日以上の項目で、前後1日の隣接を避けるために使う）
    var recDays = {};
    state.records.forEach(function (r) {
      if (!recDays[r.itemId]) recDays[r.itemId] = new Set();
      recDays[r.itemId].add(r.date);
    });
    // 固定・ゴミ（動かさないが重さには入る）
    for (i = 0; i < state.items.length; i++) {
      it = state.items[i];
      if (it.paused) continue;
      if (it.type === 'fixed') {
        for (d = today; d <= horizon; d = addD(d, 1)) {
          if (fixedMatches(it, d)) push(d, { itemId: it.id, gomiTypeId: null, done: coveredBy(it.id, null, d) });
        }
      } else if (it.type === 'gomi') {
        state.gomiTypes.forEach(function (gt) {
          for (d = addD(today, 1); d <= addD(horizon, 1); d = addD(d, 1)) {
            if (collectionMatches(gt.rule, d)) {
              var t = addD(d, -1);
              if (t >= today) push(t, { itemId: it.id, gomiTypeId: gt.id, done: coveredBy(it.id, gt.id, t) });
            }
          }
        });
      }
    }
    // 間隔タイプの各回（均し対象）
    var occs = [];
    for (i = 0; i < state.items.length; i++) {
      it = state.items[i];
      if (it.paused || it.type !== 'interval') continue;
      var bases = [], dd;
      var startD = (it.virgin && it.firstBase) ? it.firstBase : addD(it.anchor, it.interval);
      for (dd = startD; dd <= horizon; dd = addD(dd, it.interval)) bases.push(dd);
      var missed = bases.filter(function (b) { return b < today; });
      // 初回（まだ一度もやっていない間隔項目の最初の1回）かどうか。
      // 初回だけは均しの範囲を間隔いっぱいまで広げ、最初の数日への集中を避ける。
      var firstUsed = false;
      if (missed.length || it.pendingMissed) {
        occs.push({ it: it, base: missed.length ? missed[0] : today, kind: 'pending', first: !!it.virgin });
        if (it.virgin) firstUsed = true;
      }
      bases.forEach(function (b) {
        if (b >= today) occs.push({ it: it, base: b, kind: 'reg', first: !!it.virgin && !firstUsed && b === it.firstBase });
      });
    }
    occs.sort(function (a, b) { return a.base < b.base ? -1 : a.base > b.base ? 1 : 0; });
    occs.forEach(function (o) {
      var it2 = o.it, w = Math.min(it2.interval - 1, 3), cands = [], k, dd2;
      if (o.kind === 'pending') {
        // 初回のやり忘れ分は、間隔が1週間より長い項目では間隔いっぱいまで広げて均す
        var pw = o.first ? Math.max(7, it2.interval) : 7;
        for (k = 0; k < pw; k++) cands.push(addD(today, k));
      } else if (o.first) {
        // 初回だけ：登録日（基準日）から間隔いっぱいの範囲で一番空いている日へ。
        // 前にはずらさない（過ぎた日・登録前にならないため）。2回目以降は従来どおり最大前後3日。
        for (dd2 = o.base; dd2 <= addD(o.base, it2.interval - 1); dd2 = addD(dd2, 1)) if (dd2 >= today) cands.push(dd2);
      } else {
        var lo = addD(o.base, -w), hi = addD(o.base, w);
        for (dd2 = lo; dd2 <= hi; dd2 = addD(dd2, 1)) if (dd2 >= today) cands.push(dd2);
      }
      cands = cands.filter(function (x) { return !(itemDays[it2.id] && itemDays[it2.id].has(x)); });
      if (!cands.length) return;
      // 間隔3日以上：同じ項目の実施日（配置済み・記録済み）の前後1日には置かない。
      // その条件で置ける日が無い場合だけ、従来どおりの候補から置く（例外）。
      if (it2.interval >= 3) {
        var near = {};
        [itemDays[it2.id], recDays[it2.id]].forEach(function (set) {
          if (set) set.forEach(function (x) { near[addD(x, -1)] = true; near[x] = true; near[addD(x, 1)] = true; });
        });
        var pref = cands.filter(function (x) { return !near[x]; });
        if (pref.length) cands = pref;
      }
      var best = cands[0];
      cands.forEach(function (x) {
        var lx = load[x] || 0, lb = load[best] || 0;
        if (lx < lb) { best = x; return; }
        if (lx === lb && o.kind !== 'pending') {
          var dx = Math.abs(diffD(x, o.base)), db = Math.abs(diffD(best, o.base));
          if (dx < db) best = x; // 同点・同距離なら前の日（昇順走査で先勝ち）
        }
      });
      push(best, { itemId: it2.id, gomiTypeId: null, done: false }, o.base);
    });
    return map;
  }

  /* ---------- 参照 ---------- */
  function findItem(id) { return state.items.find(function (x) { return x.id === id; }) || null; }
  function findGomi(id) { return state.gomiTypes.find(function (x) { return x.id === id; }) || null; }
  function freqSummary(it) {
    if (it.type === 'interval') return it.interval + '日に1回';
    if (it.type === 'fixed') return it.fixedKind === 'weekly' ? '毎週' + WD[it.weekday] + '曜' : '毎月' + it.monthDay + '日';
    return 'ゴミの前日（種別ごと）';
  }
  function fmtJP(s) { var d = parseD(s); return (d.getMonth() + 1) + '月' + d.getDate() + '日'; }
  /* ---------- そろそろ度（間隔タイプのみ） ----------
     起点は基準日（anchor）ではなく「一番新しい記録の日」。
     記録が無い項目だけ基準日（firstBase／anchor）から数える。
     （「ついでにやった分」を記録だけ残した場合は anchor が更新されないため、
       anchor 基準だと、やったばかりでも色が付いてしまう）
     猶予：経過が「間隔＋2日」を超えるまでは色を付けない。
     それを超えた分だけ段階的に暖色へ寄せる（各段の境目も＋2日ずらす）。
     過ぎたあたり＝1（薄い黄色〜ベージュ）、1.5倍前後＝2（オレンジ）、
     2倍手前＝3（濃いオレンジ）、2倍超＝4（赤寄り）。
     固定タイプ・ゴミ前日タイプ・お休み中は常に対象外。予定の計算には使わない。 */
  var WARM = [
    null,
    { c: '#d9b84a', t: '#93751a' },
    { c: '#e59a3f', t: '#a96a17' },
    { c: '#d96f27', t: '#a9500f' },
    { c: '#c0452a', t: '#a03418' }
  ];
  function warmInfo(it, on) {
    var none = { level: 0, elapsed: 0, hasRecord: false };
    if (!it || it.type !== 'interval' || it.paused || !(it.interval >= 1)) return none;
    var onStr = on || todayStr();
    var ref = it.virgin ? (it.firstBase || it.anchor) : it.anchor;
    var hasRecord = false;
    state.records.forEach(function (r) {
      if (r.itemId !== it.id || r.date > onStr) return;
      hasRecord = true;
      if (!ref || r.date > ref) ref = r.date;
    });
    if (!ref) return none;
    var elapsed = diffD(onStr, ref), iv = it.interval, level = 0;
    if (elapsed > iv + 2) {
      if (elapsed <= 1.25 * iv + 2) level = 1;
      else if (elapsed <= 1.75 * iv + 2) level = 2;
      else if (elapsed <= 2 * iv + 2) level = 3;
      else level = 4;
    }
    return { level: level, elapsed: elapsed, hasRecord: hasRecord };
  }
  function warmLevel(it, on) { return warmInfo(it, on).level; }
  // 色だけに頼らず、経過日数を小さく出す（「遅れ」ではなく経過の表示）
  function warmLabel(info) {
    return (info.hasRecord ? '前回から' : '基準日から') + info.elapsed + '日';
  }
  function warmAttrs(level) {
    return level > 0 ? ' style="--warm:' + WARM[level].c + ';--warm-t:' + WARM[level].t + '"' : '';
  }
  // 試作版の scheduleLabel と同じ「可燃ごみの前日（火・金）」形式
  function gomiDayLabel(gt) {
    var inner;
    if (gt.rule.kind === 'weekly') {
      inner = WD_ORDER.filter(function (w) { return gt.rule.days.indexOf(w) >= 0; })
        .map(function (w) { return WD[w]; }).join('・');
    } else {
      inner = '第' + gt.rule.week + WD[gt.rule.weekday];
    }
    return gt.name + 'の前日（' + inner + '）';
  }
  function ruleSummary(rule) {
    if (rule.kind === 'weekly') {
      var ds = WD_ORDER.filter(function (w) { return rule.days.indexOf(w) >= 0; });
      return '毎週 ' + ds.map(function (w) { return WD[w]; }).join('・');
    }
    return '第' + rule.week + ' ' + WD[rule.weekday] + '曜';
  }
  function nextLabel(it) {
    if (it.paused) return 'お休み中';
    var best = null;
    SCHED.forEach(function (es, date) {
      es.forEach(function (e) {
        if (e.itemId === it.id && (!best || date < best.date)) best = { date: date, entry: e };
      });
    });
    if (!best) return '次回 —';
    var s = '次回 ' + fmtMD(best.date);
    if (it.type === 'gomi' && best.entry.gomiTypeId) {
      var gt = findGomi(best.entry.gomiTypeId);
      if (gt) s += ' ' + gt.name;
    }
    return s;
  }

  /* ---------- 記録 ---------- */
  function snapshot(it) { return { anchor: it.anchor, pendingMissed: it.pendingMissed, virgin: it.virgin, firstBase: it.firstBase }; }

  function completeToday(itemId, gtId) {
    var it = findItem(itemId); if (!it) return;
    var t = todayStr(), prev = snapshot(it);
    if (it.type === 'interval') { it.anchor = t; it.pendingMissed = false; it.virgin = false; }
    state.records.push({ id: uid(), itemId: it.id, gomiTypeId: gtId || null, date: t, coversDate: t, covers: true, prev: prev });
    save(); render();
  }
  function recordExtra(itemId, gtId) {
    var it = findItem(itemId); if (!it) return null;
    var t = todayStr(), prev = snapshot(it);
    var sched = computeSchedule(), next = null;
    sched.forEach(function (es, date) {
      if (date < t) return;
      es.forEach(function (e) {
        if (e.itemId === itemId && (e.gomiTypeId || null) === (gtId || null) && !e.done) {
          if (!next || date < next) next = date;
        }
      });
    });
    var counted = false;
    if (it.type === 'interval') {
      if (next && diffD(next, t) <= it.interval) {
        counted = true;
        it.anchor = t; it.pendingMissed = false; it.virgin = false;
        state.records.push({ id: uid(), itemId: it.id, gomiTypeId: null, date: t, coversDate: next, covers: true, prev: prev });
      } else {
        state.records.push({ id: uid(), itemId: it.id, gomiTypeId: null, date: t, coversDate: null, covers: false, prev: prev });
      }
    } else if (it.type === 'fixed') {
      counted = !!next;
      state.records.push({ id: uid(), itemId: it.id, gomiTypeId: null, date: t, coversDate: next, covers: !!next, prev: prev });
    } else {
      counted = !!next;
      state.records.push({ id: uid(), itemId: it.id, gomiTypeId: gtId || null, date: t, coversDate: next, covers: !!next, prev: prev });
    }
    save(); render();
    return { counted: counted };
  }
  function undoRecord(id) {
    var idx = state.records.findIndex(function (r) { return r.id === id; });
    if (idx < 0) return;
    var r = state.records[idx], it = findItem(r.itemId);
    if (it && r.prev) { it.anchor = r.prev.anchor; it.pendingMissed = r.prev.pendingMissed; it.virgin = r.prev.virgin; if ('firstBase' in r.prev) it.firstBase = r.prev.firstBase; }
    state.records.splice(idx, 1);
    save(); render();
  }

  /* ---------- フォーム部品 ---------- */
  function weekdayOptions(sel) {
    return WD_ORDER.map(function (w) {
      return '<option value="' + w + '"' + (w === sel ? ' selected' : '') + '>' + WD[w] + '</option>';
    }).join('');
  }
  function freqFormHTML(p, it) {
    var type = it ? it.type : 'interval';
    var fk = it ? it.fixedKind : 'weekly';
    var hasGomi = state.items.some(function (x) { return x.type === 'gomi' && (!it || x.id !== it.id); });
    var h = '<div class="freq-form" data-form="' + p + '">';
    h += '<label class="fld"><span>名前</span><input id="' + p + 'name" type="text" value="' + (it ? esc(it.name) : '') + '" placeholder="例：風呂掃除"></label>';
    h += '<label class="fld"><span>タイプ</span><select id="' + p + 'type" data-role="type-sel">';
    h += '<option value="interval"' + (type === 'interval' ? ' selected' : '') + '>間隔（○日に1回）</option>';
    h += '<option value="fixed"' + (type === 'fixed' ? ' selected' : '') + '>固定（曜日・日付）</option>';
    if (!hasGomi || type === 'gomi') h += '<option value="gomi"' + (type === 'gomi' ? ' selected' : '') + '>ゴミの前日</option>';
    h += '</select></label>';
    h += '<div data-ff="interval" style="display:' + (type === 'interval' ? 'block' : 'none') + '">';
    h += '<label class="fld inline"><input id="' + p + 'interval" type="number" inputmode="numeric" min="1" value="' + (it && it.interval ? it.interval : '') + '" placeholder="2"><span>日に1回</span></label></div>';
    h += '<div data-ff="fixed" style="display:' + (type === 'fixed' ? 'block' : 'none') + '">';
    h += '<label class="fld"><span>くり返し</span><select id="' + p + 'fixedKind" data-role="fk-sel">';
    h += '<option value="weekly"' + (fk === 'weekly' ? ' selected' : '') + '>毎週</option>';
    h += '<option value="monthly"' + (fk === 'monthly' ? ' selected' : '') + '>毎月</option></select></label>';
    h += '<div data-fk="weekly" style="display:' + (fk === 'weekly' ? 'block' : 'none') + '">';
    h += '<label class="fld"><span>曜日</span><select id="' + p + 'weekday">' + weekdayOptions(it ? it.weekday : 5) + '</select></label></div>';
    h += '<div data-fk="monthly" style="display:' + (fk === 'monthly' ? 'block' : 'none') + '">';
    h += '<label class="fld inline"><input id="' + p + 'monthDay" type="number" inputmode="numeric" min="1" max="31" value="' + (it ? it.monthDay : '') + '" placeholder="15"><span>日</span></label></div>';
    h += '</div>';
    h += '<div data-ff="gomi" style="display:' + (type === 'gomi' ? 'block' : 'none') + '"><p class="hint">ゴミの種別ごとに、収集日の前日に出ます。</p></div>';
    h += '<p class="err" id="' + p + 'err"></p>';
    h += '</div>';
    return h;
  }
  function gomiFormHTML(p, gt) {
    var kind = gt ? gt.rule.kind : 'weekly';
    var days = gt && gt.rule.kind === 'weekly' ? gt.rule.days : [];
    var h = '<div class="freq-form" data-form="' + p + '">';
    h += '<label class="fld"><span>種別名</span><input id="' + p + 'name" type="text" value="' + (gt ? esc(gt.name) : '') + '" placeholder="例：可燃ごみ"></label>';
    h += '<label class="fld"><span>収集日</span><select id="' + p + 'kind" data-role="gk-sel">';
    h += '<option value="weekly"' + (kind === 'weekly' ? ' selected' : '') + '>毎週</option>';
    h += '<option value="nth"' + (kind === 'nth' ? ' selected' : '') + '>第○週の○曜日</option></select></label>';
    h += '<div data-gk="weekly" style="display:' + (kind === 'weekly' ? 'block' : 'none') + '"><div class="wdrow" id="' + p + 'days">';
    WD_ORDER.forEach(function (w) {
      h += '<button type="button" class="wd' + (days.indexOf(w) >= 0 ? ' on' : '') + '" data-action="wd-toggle" data-day="' + w + '">' + WD[w] + '</button>';
    });
    h += '</div></div>';
    h += '<div data-gk="nth" style="display:' + (kind === 'nth' ? 'block' : 'none') + '"><div class="row2">';
    h += '<label class="fld"><span>週</span><select id="' + p + 'week">' + [1, 2, 3, 4, 5].map(function (n) {
      return '<option value="' + n + '"' + (gt && gt.rule.week === n ? ' selected' : '') + '>第' + n + '</option>';
    }).join('') + '</select></label>';
    h += '<label class="fld"><span>曜日</span><select id="' + p + 'weekday">' + weekdayOptions(gt && gt.rule.weekday != null ? gt.rule.weekday : 1) + '</select></label>';
    h += '</div></div>';
    h += '<p class="err" id="' + p + 'err"></p></div>';
    return h;
  }
  function readItemForm(p) {
    var name = document.getElementById(p + 'name').value.trim();
    var type = document.getElementById(p + 'type').value;
    var d = { name: name, type: type, interval: null, fixedKind: 'weekly', weekday: 5, monthDay: 15 };
    if (!name) return { err: '名前を入れてください' };
    if (type === 'interval') {
      var n = parseInt(document.getElementById(p + 'interval').value, 10);
      if (!(n >= 1)) return { err: '日数を入れてください' };
      d.interval = n;
    }
    if (type === 'fixed') {
      d.fixedKind = document.getElementById(p + 'fixedKind').value;
      d.weekday = +document.getElementById(p + 'weekday').value;
      if (d.fixedKind === 'monthly') {
        var md = parseInt(document.getElementById(p + 'monthDay').value, 10);
        if (!(md >= 1 && md <= 31)) return { err: '日付（1〜31）を入れてください' };
        d.monthDay = md;
      }
    }
    return { data: d };
  }
  function readGomiForm(p) {
    var name = document.getElementById(p + 'name').value.trim();
    var kind = document.getElementById(p + 'kind').value;
    if (!name) return { err: '種別名を入れてください' };
    if (kind === 'weekly') {
      var days = [];
      document.querySelectorAll('#' + p + 'days .wd.on').forEach(function (b) { days.push(+b.getAttribute('data-day')); });
      if (!days.length) return { err: '曜日を選んでください' };
      return { data: { name: name, rule: { kind: 'weekly', days: days } } };
    }
    return { data: { name: name, rule: { kind: 'nth', week: +document.getElementById(p + 'week').value, weekday: +document.getElementById(p + 'weekday').value } } };
  }
  function showErr(p, msg) { var e = document.getElementById(p + 'err'); if (e) e.textContent = msg || ''; }

  function addItem(p) {
    var r = readItemForm(p);
    if (r.err) { showErr(p, r.err); return; }
    var d = r.data, t = todayStr();
    state.items.unshift({
      id: uid(), name: d.name, type: d.type, interval: d.interval,
      fixedKind: d.fixedKind, weekday: d.weekday, monthDay: d.monthDay,
      anchor: t, createdAt: t,
      firstBase: d.type === 'interval' ? t : null,
      virgin: d.type === 'interval', pendingMissed: false, paused: false
    });
    save(); render();
  }
  function saveItem(id, p) {
    var it = findItem(id); if (!it) return;
    var r = readItemForm(p);
    if (r.err) { showErr(p, r.err); return; }
    var d = r.data;
    function sig(x) { return [x.type, x.interval, x.fixedKind, x.weekday, x.monthDay].join('|'); }
    var changed = sig(it) !== sig(d);
    var hadMissed = false;
    if (changed && it.type === 'interval') {
      hadMissed = !!it.pendingMissed;
      for (var dd = addD(it.anchor, it.interval); dd < todayStr(); dd = addD(dd, it.interval)) { hadMissed = true; break; }
    }
    it.name = d.name; it.type = d.type; it.interval = d.interval;
    it.fixedKind = d.fixedKind; it.weekday = d.weekday; it.monthDay = d.monthDay;
    if (changed) {
      it.virgin = false; it.firstBase = null;
      if (it.type === 'interval') { it.anchor = todayStr(); it.pendingMissed = hadMissed; }
      else it.pendingMissed = false;
    }
    ui.editingId = null;
    save(); render();
  }
  function addGomi(p) {
    var r = readGomiForm(p);
    if (r.err) { showErr(p, r.err); return; }
    state.gomiTypes.push({ id: uid(), name: r.data.name, rule: r.data.rule });
    save(); render();
  }
  function saveGomi(id, p) {
    var gt = findGomi(id); if (!gt) return;
    var r = readGomiForm(p);
    if (r.err) { showErr(p, r.err); return; }
    gt.name = r.data.name; gt.rule = r.data.rule;
    ui.editingGomiId = null;
    save(); render();
  }

  /* ---------- 描画：今日 ---------- */
  var CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none"><path d="M4.5 12.5 L9.5 17.5 L19.5 6.5" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  function renderToday() {
    var today = todayStr();
    var entries = SCHED.get(today) || [];
    var doneRecs = state.records.filter(function (r) { return r.date === today; });
    var td = parseD(today);
    // 今日の行は試作版と同じく「その場に残る大きなチェック行」。
    // 済んだ行も一覧に残し、行タップで取り消せる。
    var usedRecs = {};
    var rows = [];
    entries.forEach(function (e) {
      var it = findItem(e.itemId); if (!it) return;
      var rec = null;
      if (e.done) {
        // 前日に「次回分を先にやった」記録が今日をカバーしている場合もあるので記録全体から探す
        rec = state.records.find(function (r) {
          return !usedRecs[r.id] && r.itemId === e.itemId && (r.gomiTypeId || null) === (e.gomiTypeId || null) && r.covers && r.coversDate === today;
        }) || null;
        if (rec) usedRecs[rec.id] = true;
      }
      rows.push({ e: e, it: it, done: e.done, recId: rec ? rec.id : null });
    });
    // 間隔タイプの完了分は予定表から消えるので、記録から行を補う
    doneRecs.forEach(function (r) {
      if (usedRecs[r.id]) return;
      var it = findItem(r.itemId); if (!it) return;
      if (it.type === 'interval' && r.covers && r.coversDate === today) {
        usedRecs[r.id] = true;
        rows.push({ e: { itemId: it.id, gomiTypeId: null, base: today }, it: it, done: true, recId: r.id });
      }
    });
    var totalToday = rows.length;
    var doneTodayCount = rows.filter(function (x) { return x.done; }).length;
    var leftCount = totalToday - doneTodayCount;
    function subFor(row) {
      var e = row.e, it = row.it;
      if (e.base && e.base !== today) return fmtLong(e.base) + 'の分 ・ 今日へ移動';
      if (it.type === 'gomi') {
        var gt = e.gomiTypeId ? findGomi(e.gomiTypeId) : null;
        if (gt) return gomiDayLabel(gt);
      }
      return freqSummary(it);
    }
    var h = '';
    h += '<div class="today-head"><h1 class="today-title">' + (td.getMonth() + 1) + '月' + td.getDate() + '日<span class="today-wd">' + WD[td.getDay()] + '曜日</span></h1>';
    h += '<p class="today-count">' + (totalToday === 0 ? '今日の掃除はありません。' : leftCount === 0 ? '全部おわり。おつかれさま！' : '今日は ' + totalToday + ' 件（あと ' + leftCount + ' 件）') + '</p></div>';
    if (totalToday > 0) {
      h += '<div class="progress" role="progressbar" aria-valuenow="' + doneTodayCount + '" aria-valuemin="0" aria-valuemax="' + totalToday + '" aria-label="今日の進み具合"><i style="width:' + Math.round((doneTodayCount / totalToday) * 100) + '%"></i></div>';
    }
    // 未完了と完了を別々の段落として描く。完了した行は下の段落へ移り、
    // 間に大きな余白と区切り（「できたもの」見出し）を挟むことで、
    // 行が入れ替わったことが見た目で分かるようにする。
    var pendingRows = rows.filter(function (x) { return !x.done; });
    var doneRows = rows.filter(function (x) { return x.done; });
    function rowHTML(row) {
      var wi = row.done ? { level: 0 } : warmInfo(row.it, today);
      var wl = wi.level;
      var rh = '';
      rh += '<button class="task' + (wl ? ' warm' : '') + (row.done ? ' is-done' : '') + '"' + warmAttrs(wl) + ' data-action="' + (row.done ? 'undo' : 'done') + '" data-item="' + row.it.id + '" data-gomi="' + (row.e.gomiTypeId || '') + '"' + (row.recId ? ' data-id="' + row.recId + '"' : '') + ' aria-pressed="' + row.done + '" aria-label="' + esc(row.it.name) + 'を' + (row.done ? '未完了に戻す' : '完了にする') + '">';
      rh += row.done
        ? '<span class="check-circle filled" aria-hidden="true">' + CHECK_SVG + '</span>'
        : '<span class="check-circle" aria-hidden="true"></span>';
      rh += '<span class="task-main"><span class="task-name' + (row.done ? ' done-name' : '') + '">' + esc(row.it.name) + '</span>';
      rh += '<span class="task-sub">' + esc(subFor(row)) + (wl ? ' ・ <span class="warm-text">' + warmLabel(wi) + '</span>' : '') + '</span></span>';
      if (row.done) rh += '<span class="done-label">できた</span>';
      rh += '</button>';
      return rh;
    }
    pendingRows.forEach(function (row) { h += rowHTML(row); });
    if (doneRows.length) {
      h += '<div class="done-sep" role="separator" aria-label="ここからできたもの"><span class="done-sep-label">できたもの（' + doneRows.length + '件）</span></div>';
      h += '<div class="done-group">';
      doneRows.forEach(function (row) { h += rowHTML(row); });
      h += '</div>';
    }
    if (state.items.length === 0) {
      h += '<div class="empty">まだ項目がありません。<br>「項目」タブから追加できます。</div>';
    }
    // 予定外にやった記録（対象の洗い出しは従来通り）
    var extras = [];
    state.items.forEach(function (it) {
      if (it.paused) return;
      var inTasks = entries.some(function (e) { return e.itemId === it.id; });
      var recorded = doneRecs.some(function (r) { return r.itemId === it.id; });
      if (it.type === 'gomi') {
        state.gomiTypes.forEach(function (gt) {
          var hasToday = entries.some(function (e) { return e.itemId === it.id && e.gomiTypeId === gt.id; });
          var recToday = doneRecs.some(function (r) { return r.itemId === it.id && r.gomiTypeId === gt.id; });
          if (hasToday || recToday) return;
          var nextE = null;
          SCHED.forEach(function (es, date) {
            es.forEach(function (e) { if (e.itemId === it.id && e.gomiTypeId === gt.id && (!nextE || date < nextE.date)) nextE = { date: date, entry: e }; });

          var nx = null;

          });
          if (nx && nx.entry.done) return;

    });
    // 今日すでに記録した予定外分（メインの行で使った記録以外）
    var extraRecs = doneRecs.filter(function (r) { return !usedRecs[r.id]; });
    if (extras.length || extraRecs.length) {
      h += '<h2 class="sec-title">予定外にやったもの</h2>';
      h += '<p class="sec-desc">ついでにやった分はここから記録。間隔以内なら次回分扱い（間隔タイプはやった日から数え直し）。空いていれば記録だけ残します。</p>';
      if (ui.extraNotice) h += '<p class="notice" role="status">' + esc(ui.extraNotice) + '</p>';
      extraRecs.forEach(function (r) {
        var it = findItem(r.itemId);
        var sub;
        if (!r.covers) sub = '記録だけ（次回はそのまま）';
        else if (it && it.type === 'interval') sub = '次回は' + fmtJP(addD(r.date, it.interval)) + '（やった日から数え直し）';
        else sub = '次回分（' + fmtJP(r.coversDate) + '）を先にやった扱い';
        h += '<div class="rowline"><span class="extra-dot" aria-hidden="true"></span><div class="task-main">';
        h += '<div class="task-name">' + esc(it ? it.name : '（削除された項目）') + '</div>';
        h += '<div class="task-sub">' + esc(sub) + '</div></div>';
        h += '<button class="btn" data-action="undo" data-id="' + r.id + '">取り消す</button></div>';
      });
      if (ui.extraPicker) {
        extras.forEach(function (x) {
          var sub = x.gt ? gomiDayLabel(x.gt) : freqSummary(x.it);
          var xwi = warmInfo(x.it, today);
          var xwl = xwi.level;
          h += '<button class="task' + (xwl ? ' warm' : '') + '"' + warmAttrs(xwl) + ' data-action="extra" data-item="' + x.it.id + '" data-gomi="' + (x.gt ? x.gt.id : '') + '" aria-label="' + esc(x.it.name) + 'を今日やったと記録する">';
          h += '<span class="task-main"><span class="task-name">' + esc(x.it.name) + '</span>';
          h += '<span class="task-sub">' + esc(sub) + (xwl ? ' ・ <span class="warm-text">' + warmLabel(xwi) + '</span>' : '') + '</span></span>';
          h += '<span class="yatta-label">やった</span></button>';
        });
        h += '<button class="picker-cancel" data-action="extra-close">やめる</button>';
      } else if (extras.length) {
        h += '<button class="extra-cta" data-action="extra-open">＋ ついでにやった分を記録</button>';
      }
    }
    return h;
  }

  /* ---------- 描画：項目 ---------- */
  function renderItems() {
    var h = '';
    h += '<div class="today-head"><h1 class="today-title" style="font-size:24px">掃除の項目</h1><p class="today-count">追加・頻度変更・お休みができます。</p></div>';
    h += '<div class="card"><h2>項目を追加</h2>' + freqFormHTML('a-', null);

    state.items.forEach(function (it) {
      var iwi = warmInfo(it, todayStr());

        h += '<button class="btn" data-action="pause" data-item="' + it.id + '">' + (it.paused ? '再開' : 'お休み') + '</button>';
        h += '<button class="btn danger" data-action="del-ask" data-item="' + it.id + '">削除</button>';
        h += '</div>';
      }
      h += '</div>';
    });
    h += '<h2 class="sec-title">ゴミの種別</h2>';
    state.gomiTypes.forEach(function (gt) {
      var gOpen = ui.expandedGomiId === gt.id || ui.editingGomiId === gt.id || ui.confirmDelGomiId === gt.id;
      h += '<div class="card item-card"><div class="item-head"><div class="item-main">';
      h += '<div class="item-name">' + esc(gt.name) + '</div>';
      h += '<div class="item-sub">収集日：' + ruleSummary(gt.rule) + '</div>';
      h += '</div>';
      h += '<button class="expand-btn" data-action="gomi-toggle" data-gomi="' + gt.id + '" aria-expanded="' + gOpen + '" aria-label="' + esc(gt.name) + 'の操作を' + (gOpen ? '閉じる' : '開く') + '"><span class="plus" aria-hidden="true">＋</span></button>';
      h += '</div>';
      if (!gOpen) {
        h += '</div>';
        return;
      }
      if (ui.confirmDelGomiId === gt.id) {
        h += '<div class="confirm-box">「' + esc(gt.name) + '」を削除しますか？';

        h += '<button class="btn" data-action="gdel-no">やめる</button></div></div>';
      } else if (ui.editingGomiId === gt.id) {
        h += '<div class="edit-box">' + gomiFormHTML('ge-', gt);
        h += '<div class="item-btns"><button class="btn primary" data-action="gedit-save" data-gomi="' + gt.id + '">保存</button>';
        h += '<button class="btn" data-action="gedit-cancel">やめる</button></div></div>';
      } else {
        h += '<div class="item-btns">';

        h += '</div>';

    h += '<button class="btn primary big" data-action="add-gomi">追加する</button></div>';
    return h;
  }

  /* ---------- 描画：カレンダー ---------- */
  function occurrenceSet(itemId, from, to) {
    var set = new Map();
    var coveredElsewhere = {};
    state.records.forEach(function (r) {
      if (r.itemId === itemId && r.covers && r.coversDate && r.coversDate !== r.date) coveredElsewhere[r.coversDate] = true;
    });
    SCHED.forEach(function (es, date) {
      if (date < from || date > to || coveredElsewhere[date]) return;
      if (es.some(function (e) { return e.itemId === itemId; })) set.set(date, 'sched');
    });
    state.records.forEach(function (r) {
      if (r.itemId === itemId && r.date >= from && r.date <= to) set.set(r.date, 'done');
    });
    return set;
  }
  function shiftMonth(monthStr, n) {
    var d = parseD(monthStr); d.setDate(1); d.setMonth(d.getMonth() + n);
    return dstr(d).slice(0, 8) + '01';
  }
  // その日の全タスク（ドット表示と日のリスト用）。今日以降は予定表、
  // 過去の日はその日にやった記録から出す。
  function dayEntries(ds, today) {
    if (ds >= today) {
      var list = (SCHED.get(ds) || []).slice();
      if (ds === today) {
        // 今日やった分は予定表から消えることがある（間隔タイプの完了など）ので、記録から補う
        state.records.forEach(function (r) {
          if (r.date !== ds) return;
          var dup = list.some(function (e) { return e.itemId === r.itemId && (e.gomiTypeId || null) === (r.gomiTypeId || null); });
          if (!dup) list.push({ itemId: r.itemId, gomiTypeId: r.gomiTypeId || null, done: true });
        });
      }
      return list;
    }
    return state.records.filter(function (r) { return r.date === ds; }).map(function (r) {
      return { itemId: r.itemId, gomiTypeId: r.gomiTypeId || null, done: true };
    });
  }
  function renderCal() {
    var h = '';
    if (!findItem(ui.calItemId)) ui.calItemId = state.items.length ? state.items[0].id : null;
    var it = findItem(ui.calItemId);
    var first = ui.calMonth, fd = parseD(first);
    var y = fd.getFullYear(), m = fd.getMonth();
    var daysIn = new Date(y, m + 1, 0).getDate();
    var last = dstr(new Date(y, m, daysIn));
    var offset = fd.getDay();
    var sel = ui.selDay;
    var today = todayStr();
    var weekStart = addD(sel, -parseD(sel).getDay()), weekEnd = addD(weekStart, 6);
    var from = weekStart < first ? weekStart : first;
    var to = weekEnd > last ? weekEnd : last;
    var occ = it ? occurrenceSet(it.id, from, to) : new Map();
    // 項目ごとの直近の予定日。暖色は直近の1回分だけに付け、後の周期の丸は通常色のままにする
    var nextDateByItem = {};
    SCHED.forEach(function (es, date) {
      es.forEach(function (e) {
        if (!(e.itemId in nextDateByItem) || date < nextDateByItem[e.itemId]) nextDateByItem[e.itemId] = date;
      });
    });
    function entryWarmInfo(e, ds) {
      var none = { level: 0, elapsed: 0, hasRecord: false };
      if (e.done) return none;
      if (ds > today) return none; // 色は今日以前の未完了の丸だけ。今日より先の丸は通常色
      var eit = findItem(e.itemId);
      if (!eit || nextDateByItem[e.itemId] !== ds) return none;
      return warmInfo(eit, ds);
    }
    function entryWarm(e, ds) { return entryWarmInfo(e, ds).level; }
    var monthPrefix = y + '-' + pad(m + 1);
    var doneThisMonth = state.records.filter(function (r) { return r.date.slice(0, 7) === monthPrefix; }).length;
    h += '<div class="cal-head"><button class="cal-nav" data-action="cal-prev" aria-label="前月">‹</button>';
    h += '<div class="ym">' + y + '年' + (m + 1) + '月<span class="done-count">完了 ' + doneThisMonth + ' 件</span></div>';
    h += '<button class="cal-nav" data-action="cal-next" aria-label="翌月">›</button></div>';
    h += '<div class="chiprow" role="tablist">';
    state.items.forEach(function (x) {
      h += '<button class="chipbtn' + (x.id === ui.calItemId ? ' on' : '') + '" data-action="cal-chip" data-item="' + x.id + '">' + esc(x.name) + '</button>';
    });
    h += '</div>';
    h += '<div class="cal-grid">';
    WD.forEach(function (w) { h += '<div class="cal-wd">' + w + '</div>'; });
    for (var b = 0; b < offset; b++) h += '<div class="cell blank"></div>';
    for (var day = 1; day <= daysIn; day++) {
      var ds = dstr(new Date(y, m, day));
      var due = dayEntries(ds, today);
      var cls = 'cell' + (ds === today ? ' today' : '') + (ds === sel ? ' sel' : '') + (occ.has(ds) ? ' focus-day' : '');
      h += '<button class="' + cls + '" data-action="cal-day" data-date="' + ds + '" aria-label="' + fmtLong(ds) + 'の掃除を見る（' + due.length + '件）"><span class="dnum">' + day + '</span>';
      h += '<span class="dots" aria-hidden="true">';
      due.slice(0, 5).forEach(function (e) {
        var dwl = entryWarm(e, ds);
        var dc = e.done ? 'dot done' : (it && e.itemId === it.id ? 'dot focus' : 'dot');
        if (dwl) dc += ' warm';
        h += '<span class="' + dc + '"' + warmAttrs(dwl) + '></span>';
      });
      if (due.length > 5) h += '<span class="dot-more">+' + (due.length - 5) + '</span>';
      h += '</span></button>';
    }
    h += '</div>';
    if (it) {
      var wc = 0, mc = 0;
      occ.forEach(function (v, date) {
        if (date >= weekStart && date <= weekEnd) wc++;
        if (date >= first && date <= last) mc++;
      });
      h += '<p class="cal-stats">「' + esc(it.name) + '」：' + fmtMD(weekStart) + '〜' + fmtMD(weekEnd) + 'の週に <b>' + wc + ' 回</b>、この月に <b>' + mc + ' 回</b></p>';
    }
    // 選んだ日の掃除リスト
    var selEntries = dayEntries(sel, today);
    h += '<section class="day-list" aria-label="選んだ日の掃除"><h2>' + fmtLong(sel) + 'の掃除</h2>';
    if (!selEntries.length) {
      h += '<div class="empty">この日の掃除はありません</div>';
    } else {
      selEntries.forEach(function (e) {
        var item = findItem(e.itemId); if (!item) return;
        var gt = e.gomiTypeId ? findGomi(e.gomiTypeId) : null;
        var swi = entryWarmInfo(e, sel);
        var swl = swi.level;
        h += '<div class="day-row' + (swl ? ' warm' : '') + '"' + warmAttrs(swl) + '>';
        h += e.done
          ? '<span class="check-circle filled" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M4.5 12.5 L9.5 17.5 L19.5 6.5" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>'
          : '<span class="check-circle" aria-hidden="true"></span>';
        h += '<div class="rname' + (e.done ? ' is-done' : '') + '">' + esc(item.name) + (gt ? '<span class="chip">' + esc(gt.name) + '</span>' : '') + '</div>';
        if (e.done) h += '<span class="done-label">できた</span>';
        else if (swl) h += '<span class="warm-text" style="font-size:13px">' + warmLabel(swi) + '</span>';
        h += '</div>';
      });
    }
    h += '</section>';
    return h;
  }

  /* ---------- 全体描画 ---------- */
  var view = document.getElementById('view');
  var scrollRestore = null;
  // カレンダーのチップ行は描画のたびに作り直され、横スクロール位置が
  // 先頭に戻ってしまう。描画前に位置を控え、描画後に戻す。
  // 選んだチップが見える範囲の外にあれば、見える位置までだけ動かす。
  function restoreChipScroll() {
    var cr = view.querySelector('.chiprow');
    if (!cr) return;
    cr.scrollLeft = ui.calChipScroll || 0;
    var on = cr.querySelector('.chipbtn.on');
    if (!on) return;
    var crRect = cr.getBoundingClientRect();
    var onRect = on.getBoundingClientRect();
    if (onRect.left < crRect.left) cr.scrollLeft -= (crRect.left - onRect.left) + 2;
    else if (onRect.right > crRect.right) cr.scrollLeft += (onRect.right - crRect.right) + 2;
  }
  function render() {
    var oldChip = view.querySelector('.chiprow');
    if (oldChip) ui.calChipScroll = oldChip.scrollLeft;
    SCHED = computeSchedule();
    document.querySelectorAll('.tabbtn').forEach(function (b) {
      b.classList.toggle('on', b.getAttribute('data-tab') === ui.tab);
    });
    if (ui.tab === 'today') view.innerHTML = renderToday();
    else if (ui.tab === 'items') view.innerHTML = renderItems();
    else view.innerHTML = renderCal();
    if (ui.tab === 'cal') restoreChipScroll();
    if (typeof scrollRestore === 'number') {
      window.scrollTo(0, scrollRestore);
      scrollRestore = null;
    } else {
      window.scrollTo(0, 0);
    }
  }

  /* ---------- イベント ---------- */
  document.getElementById('tabbar').addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-tab]');
    if (!b) return;
    ui.tab = b.getAttribute('data-tab');
    render();
  });
  view.addEventListener('change', function (ev) {
    var el = ev.target, role = el.getAttribute && el.getAttribute('data-role');
    if (!role) return;
    var form = el.closest('.freq-form');
    if (!form) return;
    if (role === 'type-sel') form.querySelectorAll('[data-ff]').forEach(function (x) { x.style.display = x.getAttribute('data-ff') === el.value ? 'block' : 'none'; });
    if (role === 'fk-sel') form.querySelectorAll('[data-fk]').forEach(function (x) { x.style.display = x.getAttribute('data-fk') === el.value ? 'block' : 'none'; });
    if (role === 'gk-sel') form.querySelectorAll('[data-gk]').forEach(function (x) { x.style.display = x.getAttribute('data-gk') === el.value ? 'block' : 'none'; });
  });
  view.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-action]');
    if (!el) return;
    var a = el.getAttribute('data-action');
    var itemId = el.getAttribute('data-item');
    var gtId = el.getAttribute('data-gomi');
    if (['item-toggle', 'gomi-toggle', 'edit-open', 'edit-cancel', 'pause', 'del-ask', 'del-no', 'gedit-open', 'gedit-cancel', 'gdel-ask', 'gdel-no'].indexOf(a) >= 0) {
      scrollRestore = window.scrollY || window.pageYOffset || 0;
    }
    switch (a) {
      case 'done': {
        completeToday(itemId, gtId || null);
        var c = view.querySelector('.task[data-item="' + itemId + '"][data-gomi="' + (gtId || '') + '"] .check-circle');
        if (c) c.classList.add('check-pop');
        break;
      }
      case 'extra-open': ui.extraPicker = true; ui.extraNotice = null; render(); break;
      case 'extra-close': ui.extraPicker = false; render(); break;
      case 'extra': {
        var xit = findItem(itemId);
        var res = recordExtra(itemId, gtId || null);
        ui.extraPicker = false;
        if (xit && res) {
          ui.extraNotice = res.counted
            ? (xit.type === 'interval'
              ? '「' + xit.name + '」は次回分として記録。次回は' + fmtJP(addD(todayStr(), xit.interval)) + 'です。'
              : '「' + xit.name + '」は次回分を先にやった扱い。次回は飛ばします。')
            : '「' + xit.name + '」を記録しました。次回はそのままです。';
        }
        render();
        break;
      }
      case 'undo': ui.extraNotice = null; undoRecord(el.getAttribute('data-id')); break;
      case 'wd-toggle': el.classList.toggle('on'); break;
      case 'add-item': addItem('a-'); break;
      case 'item-toggle': {
        if (ui.expandedItemId === itemId) {
          ui.expandedItemId = null;
          if (ui.editingId === itemId) ui.editingId = null;
          if (ui.confirmDelId === itemId) ui.confirmDelId = null;
        } else {
          ui.expandedItemId = itemId;
        }
        render(); break;
      }
      case 'edit-open': ui.editingId = itemId; ui.expandedItemId = itemId; ui.confirmDelId = null; render(); break;
      case 'edit-cancel': ui.editingId = null; render(); break;
      case 'edit-save': saveItem(itemId, 'e-'); break;
      case 'pause': {
        var it = findItem(itemId);
        if (it) {
          it.paused = !it.paused;
          if (!it.paused && it.type === 'interval') { it.anchor = todayStr(); it.pendingMissed = false; it.virgin = false; }
          save(); render();
        }
        break;
      }
      case 'del-ask': ui.confirmDelId = itemId; ui.expandedItemId = itemId; ui.editingId = null; render(); break;
      case 'del-no': ui.confirmDelId = null; render(); break;
      case 'del-yes': {
        state.items = state.items.filter(function (x) { return x.id !== itemId; });
        state.records = state.records.filter(function (r) { return r.itemId !== itemId; });
        ui.confirmDelId = null;
        if (ui.expandedItemId === itemId) ui.expandedItemId = null;
        save(); render();
        break;
      }
      case 'add-gomi': addGomi('ga-'); break;
      case 'gomi-toggle': {
        if (ui.expandedGomiId === gtId) {
          ui.expandedGomiId = null;
          if (ui.editingGomiId === gtId) ui.editingGomiId = null;
          if (ui.confirmDelGomiId === gtId) ui.confirmDelGomiId = null;
        } else {
          ui.expandedGomiId = gtId;
        }
        render(); break;
      }
      case 'gedit-open': ui.editingGomiId = gtId; ui.expandedGomiId = gtId; ui.confirmDelGomiId = null; render(); break;
      case 'gedit-cancel': ui.editingGomiId = null; render(); break;
      case 'gedit-save': saveGomi(gtId, 'ge-'); break;
      case 'gdel-ask': ui.confirmDelGomiId = gtId; ui.expandedGomiId = gtId; ui.editingGomiId = null; render(); break;
      case 'gdel-no': ui.confirmDelGomiId = null; render(); break;
      case 'gdel-yes': {
        state.gomiTypes = state.gomiTypes.filter(function (x) { return x.id !== gtId; });
        state.records = state.records.filter(function (r) { return r.gomiTypeId !== gtId; });
        ui.confirmDelGomiId = null;
        if (ui.expandedGomiId === gtId) ui.expandedGomiId = null;
        save(); render();
        break;
      }
      case 'cal-chip': ui.calItemId = itemId; render(); break;
      case 'cal-day': ui.selDay = el.getAttribute('data-date'); render(); break;
      case 'cal-prev': ui.calMonth = shiftMonth(ui.calMonth, -1); render(); break;
      case 'cal-next': ui.calMonth = shiftMonth(ui.calMonth, 1); render(); break;
    }
  });

  render();
})();
    </script>
      <script>
/* ===== Capacitor環境専用：ゴミ収集日の前日通知 =====
   ブラウザで開いた場合は何もせず、従来どおり動作します。
   アプリ（Capacitor）でのみ、ゴミ種別ごとの収集日の前日20:00に
   ローカル通知をスケジュールします。 */
(function () {
  'use strict';
  var Cap = window.Capacitor;
  if (!Cap || !Cap.isNativePlatform || !Cap.isNativePlatform()) return;
  var LN = Cap.Plugins && Cap.Plugins.LocalNotifications;
  if (!LN) return;

  var LS_KEY = 'souji-app-v1';
  var NOTIFY_HOUR = 20, NOTIFY_MIN = 0; /* 前日20:00 */
  var WEEKS = 4;                        /* 今後4週間分を張る */
  var ID_BASE = 42000;                  /* このアプリの通知ID帯 */

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function dstr(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseD(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function addD(s, n) { var d = parseD(s); d.setDate(d.getDate() + n); return dstr(d); }
  /* 元アプリの collectionMatches と同じ判定 */
  function collectionMatches(rule, ds) {
    var d = parseD(ds);
    if (rule.kind === 'weekly') return (rule.days || []).indexOf(d.getDay()) >= 0;
    return d.getDay() === rule.weekday && Math.ceil(d.getDate() / 7) === rule.week;
  }
  function hashCode(s) { var h = 0; for (var i = 0; i < s.length; i++) { h = ((h << 5) - h + s.charCodeAt(i)) | 0; } return Math.abs(h); }
  function loadGomiTypes() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (!raw) return [];
      var st = JSON.parse(raw);
      return (st && st.gomiTypes) || [];
    } catch (e) { return []; }
  }

  var scheduling = false, queued = false;
  function scheduleAll() {
    if (scheduling) { queued = true; return; }
    scheduling = true;
    (async function () {
      try {
        var types = loadGomiTypes();
        if (types.length) {
          var perm = await LN.checkPermissions();
          if (perm.display !== 'granted') {
            perm = await LN.requestPermissions();
          }
          if (perm.display === 'granted') {
            /* 自アプリの既存通知を取り消してから張り直す */
            var pending = await LN.getPending();
            var mine = (pending.notifications || []).filter(function (n) { return n.id >= ID_BASE && n.id < ID_BASE + 100000; });
            if (mine.length) await LN.cancel({ notifications: mine.map(function (n) { return { id: n.id }; }) });
            var now = new Date();
            var today = dstr(now);
            var horizon = addD(today, WEEKS * 7 + 1);
            var list = [];
            types.forEach(function (gt) {
              if (!gt || !gt.rule || !gt.name) return;
              for (var d = addD(today, 1); d <= horizon; d = addD(d, 1)) {
                if (!collectionMatches(gt.rule, d)) continue;
                var eve = addD(d, -1);
                var at = parseD(eve); at.setHours(NOTIFY_HOUR, NOTIFY_MIN, 0, 0);
                if (at <= now) continue; /* 過ぎた分は出さない */
                list.push({
                  id: ID_BASE + (hashCode(String(gt.id) + '|' + d) % 90000),
                  title: '掃除アプリ',
                  body: '明日は「' + gt.name + '」の収集日です。今日のうちにまとめましょう。',
                  schedule: { at: at, allowWhileIdle: true }
                });
              }
            });
            if (list.length) await LN.schedule({ notifications: list });
          }
        }
      } catch (e) { /* 通知が使えなくてもアプリ本体には影響させない */ }
      scheduling = false;
      if (queued) { queued = false; scheduleAll(); }
    })();
  }

  /* 起動時 */
  scheduleAll();
  /* データ変更時：元アプリの保存（localStorage.setItem）を監視して張り直す */
  var origSet = localStorage.setItem.bind(localStorage);
  var timer = null;
  localStorage.setItem = function (k, v) {
    origSet(k, v);
    if (k === LS_KEY) {
      if (timer) clearTimeout(timer);
      timer = setTimeout(scheduleAll, 800);
    }
  };
  /* アプリに戻ってきたときにも張り直す */
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') scheduleAll();
  });
})();
